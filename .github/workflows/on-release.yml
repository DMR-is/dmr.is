name: On Release
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write
env:
  AWS_PROD_ACCOUNT_ID: 704383808130
  AWS_JAFNRETTISSTOFA_PROD_ACCOUNT_ID: '048844501286'
  ENV: prod

jobs:
  version-tag:
    name: 🔖 Version tag images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ECR_REPOSITORY: [
            official-journal-api,
            official-journal-admin-api,
            official-journal-application-api,
            official-journal-web,
            regulations-api,
            legal-gazette-api,
            legal-gazette-web,
            legal-gazette-application-web,
            legal-gazette-public-web,
            directorate-of-equality-api,
            # directorate-of-equality-partner-api and -partner-web are dev-only
            # for now: prod is held back (deploy_doe_partner: false in the infra
            # repo's DMR-Jafnrettisstofa/config/prod.yml, no prod unit dirs).
            # Re-add both here, to update-terragrunt-jafnrettisstofa and to
            # wait-jafnrettisstofa's SERVICES, in the PR that enables them in prod.
            directorate-of-equality-web,
          ]
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@v4
      - name: 🔖 Re-tag images
        uses: ./.github/actions/deploy/version-tag
        with:
          VERSION_TAG: ${{ github.ref_name }}
          ECR_REPOSITORY: ${{ matrix.ECR_REPOSITORY }}

  # Single approval gate for the whole release. The `production` environment
  # holds no secrets or variables — only a required-reviewers rule — so gating
  # one no-op job is enough: the deploy jobs below declare no environment and
  # therefore need no second approval. Known trade-off: because the deploy jobs
  # carry no environment, re-running one of them from a partially failed release
  # redeploys to prod without a fresh approval. Putting the environment back on a
  # deploy job would re-introduce the second approval this gate exists to remove.
  approve-prod:
    name: ✋ Approve prod deploy
    runs-on: ubuntu-latest
    environment: production
    needs: version-tag
    steps:
      - name: ✅ Approved
        run: echo "Approved deploy of ${{ github.ref_name }} to ${{ env.ENV }}"

  # Jafnréttisstofa goes first, it is the faster of the two. Both deploys commit
  # to main in DMR-is/infrastructure, so they must stay sequential rather than
  # racing on the push.
  deploy-jafnrettisstofa:
    name: 🚀 Deploy Jafnréttisstofa to Prod
    runs-on: ubuntu-latest
    needs: approve-prod
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@v4
      - name: 🚀 Deploy to Prod
        uses: ./.github/actions/deploy/update-terragrunt-jafnrettisstofa
        with:
          ENV: ${{ env.ENV }}
          AWS_ENV_ROLE_ARN: arn:aws:iam::${{ env.AWS_JAFNRETTISSTOFA_PROD_ACCOUNT_ID }}:role/${{ env.ENV }}-github-ci-role
          VERSION_TAG: ${{ github.ref_name }}
          PAT: ${{ secrets.DMR_ACCOUNT_PAT }}

  # The rollout waits are separate jobs that nothing depends on, so a DoE
  # rollout never holds up the Útgáfa deploy, and re-running a red wait only
  # re-checks the rollout: it redeploys nothing.
  wait-jafnrettisstofa:
    name: ⏳ Wait for Jafnréttisstofa rollout
    runs-on: ubuntu-latest
    needs: deploy-jafnrettisstofa
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@v4
      - name: ⏳ Wait for services
        uses: ./.github/actions/deploy/wait-for-services
        with:
          AWS_ENV_ROLE_ARN: arn:aws:iam::${{ env.AWS_JAFNRETTISSTOFA_PROD_ACCOUNT_ID }}:role/${{ env.ENV }}-github-ci-role
          CLUSTER: ${{ env.ENV }}-dmr-jafnrettisstofa
          # The partner api and web are dev-only for now; see the version-tag matrix.
          SERVICES: directorate-of-equality-api directorate-of-equality-web
          VERSION_TAG: ${{ github.ref_name }}

  # Ordered after Jafnréttisstofa to keep the infrastructure push sequential, but
  # not dependent on its result: a DoE terragrunt failure must not strand the
  # Útgáfa release. The explicit approve-prod check is what enforces the gate —
  # a rejected approval leaves it non-successful and this job skips.
  #
  # Re-running deploy-jafnrettisstofa re-runs this job too, whether as a single
  # job or through "Re-run failed jobs": GitHub re-runs every dependent. After a
  # newer release has shipped, re-running an old release's failed DoE deploy
  # therefore redeploys all of Útgáfa at the old tag, with no approval. Cut a new
  # release instead. A red wait job below is safe to re-run on its own.
  deploy:
    name: 🚀 Deploy to Prod
    runs-on: ubuntu-latest
    needs: [approve-prod, deploy-jafnrettisstofa]
    if: ${{ !cancelled() && needs.approve-prod.result == 'success' }}
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@v4
      - name: 🚀 Deploy to Prod
        uses: ./.github/actions/deploy/deploy
        with:
          ENV: ${{ env.ENV }}
          AWS_ENV_ROLE_ARN: arn:aws:iam::${{ env.AWS_PROD_ACCOUNT_ID }}:role/${{ env.ENV }}-github-ci-role
          VERSION_TAG: ${{ github.ref_name }}
          PAT: ${{ secrets.DMR_ACCOUNT_PAT }}

  wait-utgafa:
    name: ⏳ Wait for Útgáfa rollout
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@v4
      - name: ⏳ Wait for services
        uses: ./.github/actions/deploy/wait-for-services
        with:
          AWS_ENV_ROLE_ARN: arn:aws:iam::${{ env.AWS_PROD_ACCOUNT_ID }}:role/${{ env.ENV }}-github-ci-role
          CLUSTER: ${{ env.ENV }}-dmr-utgafa
          SERVICES: official-journal-api official-journal-admin-api official-journal-application-api official-journal-web regulations-api legal-gazette-api legal-gazette-web legal-gazette-application-web legal-gazette-public-web
          VERSION_TAG: ${{ github.ref_name }}
