services:
  legal-gazette-application-web:
    build:
      context: ../..
      dockerfile: apps/legal-gazette-application-web/Dockerfile
    ports:
      - "${LG_APPLICATION_WEB_PORT:-4300}:3000"
    environment:
      # Run this file through the varlock wrapper, not `docker compose` directly:
      #   scripts/varlock-run.sh legal-gazette-application-web docker compose -f apps/legal-gazette-application-web/docker-compose.yml up
      # The wrapper resolves this app's declared .env.schema names into the
      # environment compose interpolates from below; nothing is exported into
      # the shell any more.
      #
      # Authentication — production uses ISLAND_IS_DMR_WEB_* (shared config)
      ISLAND_IS_DMR_WEB_CLIENT_ID: ${ISLAND_IS_DMR_WEB_CLIENT_ID}
      ISLAND_IS_DMR_WEB_CLIENT_SECRET: ${ISLAND_IS_DMR_WEB_CLIENT_SECRET}
      IDENTITY_SERVER_DOMAIN: ${IDENTITY_SERVER_DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_COOKIE_SECURE: "false"

      # Production build in a local container, so the schema's "deployed" default
      # would apply. Written literally -- an exported empty string is a failure.
      DMR_RUNTIME: local

      # URLs — production env var names, set to development values.
      # BASE_URL is the app's own origin and is now the single name for it;
      # LG_APPLICATION_WEB_URL existed only so this app could hold a different value
      # from the other webs sharing one shell, which per-app resolution removed.
      BASE_URL: ${BASE_URL:-http://localhost:4300}
      NEXTAUTH_URL: ${BASE_URL:-http://localhost:4300}/api/auth
      IDENTITY_SERVER_LOGOUT_URL: ${BASE_URL:-http://localhost:4300}

      # API — host.docker.internal resolves to the Docker host (macOS/Windows)
      # On Linux, use --add-host=host.docker.internal:host-gateway or the host IP
      DMR_ADMIN_API_BASE_PATH: http://host.docker.internal:4100
